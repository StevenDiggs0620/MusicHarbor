[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "musicharbor"
version = "1.3.0"
description = "A local desktop workspace for playlist matching, music purchasing, and library management"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "mutagen>=1.47,<2",
    "scipy>=1.14,<2",
    "pywebview>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pyinstaller>=6.10,<7",
]
browser = [
    "playwright>=1.40,<2",
]

[project.scripts]
musicharbor = "musicharbor.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
musicharbor = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
